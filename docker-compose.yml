version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: culturequest_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-secret}
      MONGO_INITDB_DATABASE: culturequest
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: culturequest_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-secret}
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    container_name: culturequest_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
      - redis


volumes:
  mongo_data:
  redis_data:
